{% extends "base.html" %}
{% block title %}Nueva cuenta{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1>Nueva cuenta</h1>
    <div class="subtitle">Agrega una cuenta al plan de cuentas</div>
  </div>
  <a href="{{ url_for('cuentas') }}" class="btn btn-secondary">Volver</a>
</div>

<div class="panel" style="max-width:640px;">
  <form method="post">
    <div class="form-grid">
      <div class="field">
        <label>Código</label>
        <input type="text" name="codigo" placeholder="Ej. 1000" required
               value="{{ cuenta.codigo if cuenta else '' }}">
      </div>
      <div class="field">
        <label>Tipo de cuenta</label>
        <select name="tipo" required>
          {% for t in tipos %}
          <option value="{{ t }}" {{ 'selected' if cuenta and cuenta.tipo==t }}>{{ t }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field full">
        <label>Nombre de la cuenta</label>
        <input type="text" name="nombre" placeholder="Ej. Caja general" required
               value="{{ cuenta.nombre if cuenta else '' }}">
      </div>
      <div class="field">
        <label>Saldo inicial (opcional)</label>
        <input type="number" step="0.01" name="saldo_inicial" placeholder="0.00"
               value="{{ cuenta.saldo_inicial if cuenta else '' }}">
      </div>
    </div>
    <div class="actions-row">
      <button type="submit" class="btn">Guardar cuenta</button>
      <a href="{{ url_for('cuentas') }}" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
